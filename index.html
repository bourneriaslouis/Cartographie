<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louis Bournerias | Cartographie </title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES DE COULEUR (Basées sur le CV) --- */
        :root {
            --primary-blue: #0f1628; /* Le bleu sombre du header/footer */
            --accent-white: #ffffff;
            --text-dark: #333333;
            --text-gray: #666666;
            --border-radius: 8px;
        }

        /* --- RESET & GLOBAL --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f4f4;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Prend toute la hauteur de l'écran */
        }

        /* --- HEADER --- */
        header {
            background-color: var(--primary-blue);
            color: var(--accent-white);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 4px solid var(--accent-white); /* Rappel de la ligne sous le nom */
        }

        h1 {
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-weight: 300;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        /* --- MAIN CONTENT --- */
        main {
            flex: 1; /* Pousse le footer vers le bas */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: white;
            padding: 3rem 2rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 2px;
            border-top: 6px solid var(--primary-blue); /* Rappel esthétique */
        }

        .icon-map {
            width: 60px;
            height: 60px;
            margin-bottom: 1.5rem;
            fill: var(--primary-blue);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary-blue);
        }

        p {
            line-height: 1.6;
            color: var(--text-gray);
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-blue);
            color: white;
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            border-radius: 30px; /* Bouton arrondi */
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* --- FOOTER (Reprise des coordonnées) --- */
        footer {
            background-color: var(--primary-blue);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .footer-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .footer-item a {
            color: white;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .footer-item a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .card { padding: 2rem 1.5rem; }
            .footer-content { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Louis Bournérias</h1>
            <div class="subtitle">Etudiant en Géographie </div>
        </div>
    </header>

    <main>
        <section class="card">
            <svg class="icon-map" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>

            <h2>Site en cours de création</h2>
            
            <p>
                Bonjour et bienvenue. Je travaille actuellement à la mise en place de mon portfolio.
            </p>

            <a href="mailto:bournerias.louis@gmail.com" class="btn">Me contacter par email</a>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-item">
                <span>📧</span>
                <a href="mailto:bournerias.louis@gmail.com">bournerias.louis@gmail.com</a>
            </div>
        </div>
        <br>
        <div style="opacity: 0.5; font-size: 0.7rem; margin-top: 1rem;">
            © 2026 Louis Bournerias - Tous droits réservés
        </div>
    </footer>

</body>
</html>
